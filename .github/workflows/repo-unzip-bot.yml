name: Mobile Repo Auto-Unzip Bot

on:
  push:
  workflow_dispatch: # மொபைலில் 'Run workflow' பட்டன் மூலமும் மேனுவலாக இயக்கலாம்

permissions:
  contents: write

jobs:
  unpack-and-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT || secrets.GITHUB_TOKEN }}

      - name: Locate, Extract and Preserve Directory Structure
        id: unzip_step
        run: |
          # 1. ரூட்டில் .zip உள்ளதா எனத் தேடுதல்
          ZIP_NAME=$(find . -maxdepth 1 -name "*.zip" -type f -printf "%f\n" | head -n 1)

          if [ -z "$ZIP_NAME" ]; then
            echo "ரூட்டில் எந்த .zip ஃபைலும் இல்லை. எக்ஸ்ட்ராக்ஷன் தேவையில்லை."
            echo "has_zip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_zip=true" >> $GITHUB_OUTPUT
          echo "கண்டறியப்பட்ட ZIP: $ZIP_NAME"

          # 2. தற்காலிக வொர்க்ஸ்பேஸ்
          TEMP_DIR=".temp_extract_stage"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          # 3. அன்சிப் செய்தல்
          unzip -q -o "$ZIP_NAME" -d "$TEMP_DIR"

          # 4. ஒற்றை Parent Folder இருந்தால் Flatten செய்தல்
          ITEMS_COUNT=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)
          FIRST_ITEM=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1)

          SOURCE_DIR="$TEMP_DIR"
          if [ "$ITEMS_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            echo "Parent folder detected: $(basename "$FIRST_ITEM"). Flattening to root..."
            SOURCE_DIR="$FIRST_ITEM"
          fi

          # 5. அசல் ZIP-ஐ ரீநேம் செய்தல்
          mv "$ZIP_NAME" "${ZIP_NAME}.extracted"

          # 6. .github, workflows உட்பட அனைத்தையும் ரூட்டுக்கு நகர்த்துதல்
          shopt -s dotglob nullglob
          cp -rf "$SOURCE_DIR"/* ./
          shopt -u dotglob nullglob

          # 7. க்ளீன் அப்
          rm -rf "$TEMP_DIR"

      - name: Commit Extracted Structure to Root
        if: steps.unzip_step.outputs.has_zip == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff-index --quiet HEAD; then
            echo "கமிட் செய்ய புதிய மாற்றங்கள் இல்லை."
          else
            git commit -m "Auto-unpacked archive structure to root and renamed zip"
            git push origin ${{ github.ref_name }}
          fi
          
